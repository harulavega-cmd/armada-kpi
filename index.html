<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#070b14"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>ARMA · Haru Ai</title>
<style>
:root{--bg:#070b14;--card:#0e1624;--line:#1c2a40;--text:#eef3fb;--dim:#8b9bb3;--bad:#ff5d5d;--warn:#f5b942;--ok:#3ddc97;--run:#86efac}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,sans-serif}
.top{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:16px} .meta{font-size:11px;color:var(--dim)}
.pill{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;background:#132033;color:var(--ok);border:1px solid #1c2a40}
main{max-width:720px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.kpi b{display:block;font-size:20px;margin-top:2px} .kpi span{font-size:10px;color:var(--dim)}
.note{border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:13px}
.bad{background:#2a1214;border-left:3px solid var(--bad)}
.warn{background:#2a220e;border-left:3px solid var(--warn)}
.run{background:#0e2418;border-left:3px solid var(--run)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #1c2a40;font-size:13px}
.row:last-child{border-bottom:0}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px}
.t0{background:#3a1515;color:var(--bad)} .tlow{background:#3a2e10;color:var(--warn)}
.t-run{background:#14301f;color:var(--run)}
.cmd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;line-height:1.45}
footer{color:var(--dim);font-size:11px;margin:16px 4px}
</style></head><body>
<header class="top"><div><h1>ARMA · Haru Ai</h1><div class="meta">Hanya data penting · solar = % tangki</div></div><div class="pill" id="pill">LIVE</div></header>
<main>
<section class="kpis" id="kpis"></section>
<article id="blocks"></article>
<article class="cmd" id="cmd"></article>
<footer>Apps Haru Ai / ARMA · unit aman disembunyikan. ARMA 16:00 · Chief 07:00.</footer>
</main>
<script>
const UNITS=[{"nopol":"B9153KPA","st":"JALAN","spd":18,"odo":3152.2,"fuel":null,"loc":"Cikupa","ageh":0},{"nopol":"B9768FYY","st":"PARKIR","spd":0,"odo":128657.3,"fuel":55,"loc":"Cempaka","ageh":1},{"nopol":"B9044FYZ","st":"PARKIR","spd":0,"odo":32707,"fuel":91,"loc":"Widang","ageh":1},{"nopol":"B9032FYZ","st":"JALAN","spd":11,"odo":153649.2,"fuel":76,"loc":"Anyar","ageh":0},{"nopol":"B9421FYY","st":"PARKIR","spd":0,"odo":159859.7,"fuel":92,"loc":"Tambun Selatan","ageh":2.4},{"nopol":"B9209FYX","st":"PARKIR","spd":0,"odo":319551.1,"fuel":44,"loc":"Pasar Kemis","ageh":1.3},{"nopol":"B9593KDB","st":"JALAN","spd":47,"odo":394667.6,"fuel":8,"loc":"Cikupa","ageh":0},{"nopol":"B9207FYX","st":"JALAN","spd":15,"odo":303053,"fuel":46,"loc":"Darangdan","ageh":0},{"nopol":"B9205FYX","st":"PARKIR","spd":0,"odo":301783.6,"fuel":0,"loc":"Tambun Selatan","ageh":3.3},{"nopol":"B9629KQB","st":"JALAN","spd":33,"odo":495450.8,"fuel":19,"loc":"Kelapa Dua","ageh":0},{"nopol":"R8342OC","st":"PARKIR","spd":0,"odo":250787.3,"fuel":76,"loc":"Cipanas","ageh":0.9},{"nopol":"B9531FYY","st":"MESIN ON","spd":0,"odo":164828.6,"fuel":13,"loc":"Cempaka","ageh":0},{"nopol":"B9580FYX","st":"PARKIR","spd":0,"odo":135170.2,"fuel":20,"loc":"Pasar Kemis","ageh":2.6},{"nopol":"B9217FYX","st":"PARKIR","spd":0,"odo":296608.6,"fuel":25,"loc":"Cempaka","ageh":6.6},{"nopol":"B9208FYX","st":"PARKIR","spd":0,"odo":277721,"fuel":57,"loc":"Tambun Selatan","ageh":4.4},{"nopol":"B9206FYX","st":"JALAN","spd":59,"odo":13642.6,"fuel":100,"loc":"Cikupa","ageh":0},{"nopol":"Z9892MN","st":"PARKIR","spd":0,"odo":194283.8,"fuel":13,"loc":"Pasar Kemis","ageh":5.3},{"nopol":"F8291HF","st":"STALE","spd":0,"odo":381790.4,"fuel":30,"loc":"Bogor Kabupaten","ageh":61.6},{"nopol":"F9021AC","st":"PARKIR","spd":0,"odo":83682.8,"fuel":21,"loc":"Kedungwaringin","ageh":6.3},{"nopol":"B9615KQB","st":"PARKIR","spd":0,"odo":225404.8,"fuel":0,"loc":"Gunung Guruh","ageh":0.2}];
const STAMP="28 Agu 2026 \u00b7 23:28 WIB";
const crit=u=>u.fuel!=null&&u.fuel<=3;
const low=u=>u.fuel!=null&&u.fuel>3&&u.fuel<40;
const stale=u=>u.st==="STALE"||(u.ageh!=null&&u.ageh>=8);
const aktif=u=>u.st==="JALAN"||u.st==="MESIN ON";
function rel(u){if(u.ageh==null)return "—"; if(u.ageh<0.08)return "baru"; if(u.ageh<1)return Math.round(u.ageh*60)+" mnt"; if(u.ageh<24)return u.ageh.toFixed(1)+" jam"; return (u.ageh/24).toFixed(1)+" hari";}
function list(arr,fn){return arr.length?arr.map(fn).join(""):'<div class="meta">Tidak ada</div>';}
const C=UNITS.filter(crit).sort((a,b)=>a.fuel-b.fuel);
const L=UNITS.filter(low).sort((a,b)=>a.fuel-b.fuel);
const S=UNITS.filter(stale).sort((a,b)=>b.ageh-a.ageh);
const A=UNITS.filter(aktif);
document.getElementById("kpis").innerHTML=`<div class="kpi"><span>Unit</span><b>${UNITS.length}</b></div><div class="kpi"><span>CRITICAL</span><b style="color:var(--bad)">${C.length}</b></div><div class="kpi"><span>LOW</span><b style="color:var(--warn)">${L.length}</b></div><div class="kpi"><span>Jalan/ON</span><b style="color:var(--run)">${A.length}</b></div>`;
document.getElementById("blocks").innerHTML=`<div class="note bad"><b>CRITICAL ≤3%</b>${list(C,u=>`<div class="row"><b>${u.nopol}</b><span class="tag t0">${u.fuel}%</span> · ${u.st} · ${u.loc}</div>`)}</div><div class="note warn"><b>LOW <40%</b>${list(L,u=>`<div class="row"><b>${u.nopol}</b><span class="tag tlow">${u.fuel}%</span> · ${u.st} · ${u.loc}</div>`)}</div><div class="note warn"><b>GPS stale >8 jam</b>${list(S,u=>`<div class="row"><b>${u.nopol}</b><span>${rel(u)} · ${u.loc}</span></div>`)}</div><div class="note run"><b>Aktif sekarang</b>${list(A,u=>`<div class="row"><b>${u.nopol}</b><span class="tag t-run">${u.st}</span> ${u.spd} km/j · ${u.loc}</div>`)}</div>`;
let cmd = C.length ? ("Isi solar dulu: "+C.map(u=>u.nopol+" "+u.fuel+"%").join(", ")) : (L.length ? ("Pantau LOW: "+L.slice(0,3).map(u=>u.nopol).join(", ")) : "Tidak ada CRITICAL.");
if(S.length) cmd += " | Cek GPS "+S[0].nopol;
document.getElementById("cmd").innerHTML="<b>1 perintah ARMA</b><br>"+cmd;
document.getElementById("pill").textContent="LIVE \u00b7 "+STAMP;
</script></body></html>
