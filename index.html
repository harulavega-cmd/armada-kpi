<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0e0d0b"/>
<title>ARMA · Haru Ai</title>
<style>
:root{--bg:#0e0d0b;--fg:#f4efe6;--muted:#9a9286;--card:#1c1a16;--ok:#6f9a6b;--line:rgba(244,239,230,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,sans-serif;min-height:100dvh;padding:28px 20px calc(28px + env(safe-area-inset-bottom))}
main{max-width:420px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 8px;font-weight:600}
p{color:var(--muted);line-height:1.5;margin:0 0 12px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:0 12px;border-radius:999px;background:rgba(111,154,107,.15);color:var(--ok);font-size:12px;font-weight:600;margin-bottom:18px}
.dot{width:6px;height:6px;border-radius:99px;background:var(--ok)}
a.btn{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:12px 16px;margin:0 0 10px;border-radius:16px;background:var(--card);color:var(--fg);text-decoration:none;border:1px solid var(--line);font-weight:500}
a.btn span{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
</style>
</head>
<body>
<main>
<div class="pill"><span class="dot"></span> Live di Haru Ai</div>
<h1>ARMA</h1>
<p>Angka armada live dari Cartrack GET /vehicles/status. Solar = % tangki. Papan GitHub ini hanya pintasan.</p>
<a class="btn" href="https://docs.google.com/spreadsheets/d/1nJl2dhZfPnnZEAVPIUcK_RLJiUSmGYSHU11cK5Mpg-A/edit">Control Tower<span>ARMADA_LIVE</span></a>
<a class="btn" href="https://docs.google.com/spreadsheets/d/1g9abid0oPFeRtFxWOuS-TxMpYYTNU6mQyUmH_LOnjlg/edit">Papan Data Tim<span>Tulis harian</span></a>
</main>
</body>
</html>
